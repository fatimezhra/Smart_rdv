# Test configuration - override main database settings
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# JWT configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-only-must-be-at-least-32-characters-long

# Admin credentials for tests
admin.default.email=admin@test.com
admin.default.password=admin123

# Disable some features for tests
spring.jpa.defer-datasource-initialization=true
