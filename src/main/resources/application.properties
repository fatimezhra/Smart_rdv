# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-eu-west-3.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.nswmogtsgobvwfumqalr}
spring.datasource.password=${DB_PASSWORD:ouiamedatabase19}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP ---
spring.datasource.hikari.pool-name=SmartRDV-HikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=8081
server.error.include-message=always

# --- JWT ---
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkeymysecretkey}

# --- Admin Default Credentials ---
admin.default.email=${ADMIN_EMAIL:admin@smartrdv.com}
admin.default.password=${ADMIN_PASSWORD:Admin1234!}