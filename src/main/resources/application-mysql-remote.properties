# --- Datasource ---
spring.datasource.url=jdbc:mysql://smartrdv-uca-5230.i.aivencloud.com:28865/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC&useSSL=true
spring.datasource.username=avnadmin
spring.datasource.password=AVNS_KnIn-Q6sJwDbQXfaFO4
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP (Cloud Optimized) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=SmartRDV-HikariPool
spring.datasource.hikari.auto-commit=false

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- Initialization ---
spring.sql.init.mode=never

# --- Server ---
server.port=8081
server.error.include-message=always

# --- Logging (dev only - remove in production) ---
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG
