services:
  db:
    image: postgres:15
    container_name: smartrdv-db
    environment:
      - POSTGRES_DB=smartrdv_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartrdv_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartrdv-app
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://db:5432/smartrdv_db
      - DB_USER=postgres
      - DB_PASSWORD=root
      - JWT_SECRET=mysecretkeymysecretkeymysecretkeymysecretkey